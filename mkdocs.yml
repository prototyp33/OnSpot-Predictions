site_name: OnSpot Predictive Model
site_description: A machine learning system for predicting parking occupancy and analyzing parking patterns
site_author: Your Name
site_url: https://github.com/yourusername/OnSpot_Predictive_Model

repo_name: OnSpot_Predictive_Model
repo_url: https://github.com/yourusername/OnSpot_Predictive_Model
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: user_guide/getting_started.md
    - Installation: user_guide/installation.md
    - Configuration: user_guide/configuration.md
    - Examples: user_guide/examples.md
  - API Reference:
    - Overview: api_reference/index.md
    - Data Processing: api_reference/data.md
    - Models: api_reference/models.md
    - Pipelines: api_reference/pipelines.md
    - Utilities: api_reference/utils.md
  - Developer Guide:
    - Setting Up: developer_guide/setting_up.md
    - Contributing: developer_guide/contributing.md
    - Testing: developer_guide/testing.md
  - Architecture:
    - Overview: architecture/overview.md
    - Components: architecture/components.md
    - Design: architecture/design.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          rendering:
            show_source: true
  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/onspot/

extra_javascript:
  - javascripts/config.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css 