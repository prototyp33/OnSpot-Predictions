<!DOCTYPE html>
<html>
<head>
  <title>CORS Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Edge Function CORS Test</h1>
  <button id="testBtn">Test CORS</button>
  <h2>Response:</h2>
  <pre id="result">Click the button to test...</pre>

  <script>
    document.getElementById('testBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('http://localhost:54321/functions/v1/analyze-drift', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer your-token-here' // Replace with actual token if needed
          },
          body: JSON.stringify({
            featureNames: ["temperature"],
            timeframe: "week",
            modelId: "test-model"
          })
        });
        
        const data = await response.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        document.getElementById('result').textContent = error.toString();
      }
    });
  </script>
</body>
</html>
