# A/B Testing Configuration

# Default settings for all experiments
defaults:
  min_sample_size: 1000
  confidence_level: 0.95
  max_duration_days: 30  # Maximum duration for an experiment
  metrics_storage: "metrics"  # Directory to store metrics

# Experiment-specific configurations
experiments:
  model_v2_evaluation:
    name: "model_v2_evaluation"
    description: "Evaluating performance of v2 model against current production model"
    variants:
      - name: "control"
        model_version: "v1.0.0"
      - name: "treatment"
        model_version: "v2.0.0"
    traffic_split: [0.8, 0.2]  # 80% control, 20% treatment
    success_criteria:
      - metric: "prediction_error"
        improvement_threshold: 0.1  # 10% improvement required
      - metric: "response_time"
        improvement_threshold: 0.2  # 20% improvement required

  feature_engineering_test:
    name: "feature_engineering_test"
    description: "Testing new feature engineering pipeline"
    variants:
      - name: "control"
        feature_set: "base"
      - name: "treatment"
        feature_set: "enhanced"
    traffic_split: [0.5, 0.5]  # Equal split
    success_criteria:
      - metric: "prediction_error"
        improvement_threshold: 0.05  # 5% improvement required

# Monitoring settings
monitoring:
  alert_thresholds:
    min_traffic_rate: 100  # Minimum requests per hour
    error_rate_threshold: 0.01  # 1% error rate threshold
    latency_p95_threshold: 200  # 95th percentile latency threshold in ms
  
  reporting:
    update_frequency: 3600  # Update metrics every hour
    export_format: "csv"
    notification_channels:
      - email
      - slack

# Storage settings
storage:
  metrics_format: "parquet"
  retention_period_days: 90
  compression: true
  backup_enabled: true 