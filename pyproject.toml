[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onspot-predictive-model"
version = "1.0.0"
description = "A machine learning system for predicting parking occupancy"
readme = "README.md"
authors = [
    {name = "OnSpot Team", email = "team@onspot.example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.4.0",
    "streamlit>=1.28.0",
    "evidently>=0.4.0",
    "alibi-detect>=0.11.0",
    "python-dateutil>=2.8.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "memory-profiler>=0.61.0",
    "psutil>=5.9.5",
    "jsonschema>=4.19.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "black>=23.10.0",
    "isort>=5.12.0",
    "types-python-dateutil>=2.8.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    "httpx>=0.25.0",
]

[project.urls]
"Homepage" = "https://github.com/onspot/predictive-model"
"Bug Tracker" = "https://github.com/onspot/predictive-model/issues"

[tool.setuptools]
packages = ["parking_sim", "api", "monitoring"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "B", "I", "N", "UP", "ANN", "C4", "SIM", "ARG", "ERA"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.isort]
known-first-party = ["parking_sim", "api", "monitoring"]

[tool.ruff.flake8-annotations]
allow-star-arg-any = true

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "matplotlib.*", "seaborn.*", "sklearn.*", "xgboost.*", "lightgbm.*", "catboost.*", "alibi_detect.*", "evidently.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=parking_sim --cov=api --cov=monitoring --cov-report=term-missing" 