global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prediction-api'
    static_configs:
      - targets: ['prediction-api:5000']
    metrics_path: '/metrics'

  - job_name: 'deployment-gateway'
    static_configs:
      - targets: ['deployment-gateway:8080']
    metrics_path: '/metrics'

  - job_name: 'monitoring'
    static_configs:
      - targets: ['monitoring:8000']
    metrics_path: '/metrics' 